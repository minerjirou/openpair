[package]
name = "pair-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "openpair node daemon (supervisor) - clean-room PAIR-interoperable node"

[[bin]]
name = "openpair-node"
path = "src/main.rs"

[dependencies]
pair-proto = { path = "../pair-proto" }
pair-nodeinfo = { path = "../pair-nodeinfo" }
pair-discovery = { path = "../pair-discovery" }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
uuid = { version = "1", features = ["v4"] }
