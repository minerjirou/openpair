[package]
name = "pair-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "openpair node daemon (supervisor) - clean-room PAIR-interoperable node"

[[bin]]
name = "openpair-node"
path = "src/main.rs"

[dependencies]
pair-proto = { path = "../pair-proto" }
pair-nodeinfo = { path = "../pair-nodeinfo" }
pair-discovery = { path = "../pair-discovery" }
pair-trust = { path = "../pair-trust" }
pair-proxy = { path = "../pair-proxy" }
pair-ui = { path = "../pair-ui" }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
