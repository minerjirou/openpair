[package]
name = "pair-trust"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cluster identity (Ed25519 X.509), certificate pinning, and mutual-TLS trust"

[dependencies]
pair-proto = { path = "../pair-proto" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
rcgen = { version = "0.13", features = ["pem", "crypto"] }
rustls-pki-types = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
x509-parser = "0.16"
time = { version = "0.3", default-features = false }
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core", "pem"] }
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
