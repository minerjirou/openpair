[workspace]
resolver = "2"
members = [
    "crates/pair-proto",
    "crates/pair-rpc",
    "crates/pair-nodeinfo",
    "crates/pair-discovery",
    "crates/pair-trust",
    "crates/pair-pairing",
    "crates/pair-proxy",
    "crates/pair-node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
